name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One build per hardware SKU. Add a SKU by extending matrix.sku — the rest
  # of the pipeline parameterises over ${{ matrix.sku }}. The server consumes
  # the combined manifest.json produced by the `publish` job.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sku: jb-eink-v1
            cap_flags: '-DJELLYBOX_SKU_EINK_V1'
          - sku: jb-tft-v1
            cap_flags: '-DJELLYBOX_SKU_TFT_V1'
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Setup ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          # All SKU libs installed in every job — only the linked SKU
          # actually pulls each one in via #include, so the eInk build
          # doesn't bloat from the ST7789 lib being present and vice versa.
          arduino-cli lib install \
            "WiFiManager@2.0.17" \
            "Adafruit NeoPixel@1.12.0" \
            "Adafruit PN532@1.3.0" \
            "GxEPD2@1.6.0" \
            "Adafruit GFX Library@1.11.0" \
            "Adafruit ST7735 and ST7789 Library@1.10.4" \
            "ArduinoJson@7.0.0"

      - name: Compile firmware (${{ matrix.sku }})
        run: |
          mkdir -p build
          VERSION="${GITHUB_REF_NAME:-dev}"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build \
            --export-binaries \
            --build-property "build.extra_flags=-DFIRMWARE_VERSION=\"${VERSION}\" -DJELLYBOX_SKU=\"${{ matrix.sku }}\" ${{ matrix.cap_flags }} -DESP32" \
            ./jellybox-firmware

      - name: Check OTA partition fit
        run: |
          SIZE=$(stat -c '%s' build/jellybox-firmware.ino.bin)
          MAX=1966080
          PCT=$((SIZE * 100 / MAX))
          echo "[${{ matrix.sku }}] Binary: $SIZE bytes ($PCT% of OTA partition)"
          if [ $SIZE -gt $MAX ]; then
            echo "::error::[${{ matrix.sku }}] Binary ($SIZE bytes) exceeds OTA partition size ($MAX bytes)!"
            exit 1
          fi
          if [ $PCT -gt 85 ]; then
            echo "::warning::[${{ matrix.sku }}] Binary is over 85% of OTA partition — consider a custom partition scheme"
          fi

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cd build
          for f in jellybox-firmware.ino.*; do
            suffix="${f#jellybox-firmware.ino.}"
            mv "$f" "jellybox-firmware-${{ matrix.sku }}-${VERSION}.${suffix}"
          done
          ls -la

      - name: Generate per-SKU manifest fragment
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          SKU="${{ matrix.sku }}"
          BIN_FILE="build/jellybox-firmware-${SKU}-${VERSION}.bin"
          SHA256=$(sha256sum "$BIN_FILE" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$BIN_FILE")

          cat > build/manifest-${SKU}.json <<EOF
          {
            "sku": "${SKU}",
            "chipFamily": "ESP32",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/jellybox-firmware-${SKU}-${VERSION}.bin",
            "mergedUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/jellybox-firmware-${SKU}-${VERSION}.merged.bin",
            "sha256": "${SHA256}",
            "size": ${SIZE}
          }
          EOF
          cat build/manifest-${SKU}.json

      - name: Upload per-SKU build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellybox-firmware-${{ matrix.sku }}
          path: |
            build/jellybox-firmware-${{ matrix.sku }}-*.bin
            build/jellybox-firmware-${{ matrix.sku }}-*.elf
            build/manifest-${{ matrix.sku }}.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all SKU artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jellybox-firmware-*
          path: artifacts
          merge-multiple: true

      - name: Combine SKU manifests into manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Combine each manifest-<sku>.json fragment into one builds[] array.
          BUILDS=$(jq -s '.' artifacts/manifest-*.json)
          jq -n \
            --arg version "${VERSION}" \
            --arg released_at "${RELEASED_AT}" \
            --argjson builds "${BUILDS}" \
            '{version: $version, released_at: $released_at, builds: $builds}' \
            > artifacts/manifest.json
          cat artifacts/manifest.json

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellybox-firmware
          path: |
            artifacts/*.bin
            artifacts/*.elf
            artifacts/manifest.json

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.bin
            artifacts/*.elf
            artifacts/manifest.json
          generate_release_notes: true
